plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
}

// Empty stand-ins for a VoidClip class our mixins name in signatures. Compiled against, never shipped.
sourceSets {
    stubs
}
dependencies {
    compileOnly sourceSets.stubs.output
}

// liminal. (VoidClip) and Chromeflesh are optional and only ever reached by reflection or @Pseudo mixins,
// so nothing compiles against them. The *Compat runs drop their jars into run-compat/mods to test with them loaded.
var compatJars = [file(project.voidclip_jar), file(project.chromeflesh_jar)]
var compatAvailable = compatJars.every { it.exists() }

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientCompat {
            client()
            gameDirectory = project.file('run-compat')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServerCompat {
            type = "gameTestServer"
            gameDirectory = project.file('run-compat')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var copyCompatMods = tasks.register('copyCompatMods', Sync) {
    from compatJars
    into 'run-compat/mods'
}
tasks.matching { it.name in ['runGameTestServerCompat', 'runClientCompat'] }.configureEach {
    dependsOn copyCompatMods
    onlyIf('VoidClip and Chromeflesh jars are present') { compatAvailable }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// `./gradlew build` boots a headless GameTest server twice: once alone, once beside VoidClip and Chromeflesh.
tasks.named('check') {
    dependsOn 'runGameTestServer', 'runGameTestServerCompat'
    if (!compatAvailable) logger.warn('Nightvein: VoidClip/Chromeflesh jars not found, the compat GameTests will be skipped')
}
