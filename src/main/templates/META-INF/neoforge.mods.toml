modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="nightvein_logo.png"
logoBlur=false
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Chromeflesh: vampire speed + chrome legs = Bloodrush, the fastest thing alive. The chrome drinks your blood to do it.
[[dependencies.${mod_id}]]
modId="chromeflesh"
type="optional"
versionRange="[0.1.0,)"
ordering="NONE"
side="BOTH"

# liminal. (VoidClip): run fast enough and you can tackle Bacteria to the floor, and knock it off whoever it's holding.
[[dependencies.${mod_id}]]
modId="voidclip"
type="optional"
versionRange="[2.0.0,)"
ordering="NONE"
side="BOTH"
